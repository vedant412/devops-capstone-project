apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: cd-pipeline
spec:
  workspaces:
    - name: pipeline-workspace
  params:
    - name: repo-url
      type: string
    - name: branch
      type: string
      default: main
    - name: image
      type: string
  tasks:
    - name: init
      taskRef:
        name: cleanup
      workspaces:
        - name: source
          workspace: pipeline-workspace
    - name: clone
      runAfter: [init]
      taskRef:
        name: git-clone
        kind: ClusterTask
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.branch)
      workspaces:
        - name: output
          workspace: pipeline-workspace
    - name: test
      runAfter: [clone]
      taskRef:
        name: check-accounts
      workspaces:
        - name: source
          workspace: pipeline-workspace
    - name: build
      runAfter: [test]
      taskRef:
        name: buildah
        kind: ClusterTask
      params:
        - name: IMAGE
          value: $(params.image)
      workspaces:
        - name: source
          workspace: pipeline-workspace
    - name: deploy
      runAfter: [build]
      taskRef:
        name: deploy-accounts
      params:
        - name: image
          value: $(params.image)
      workspaces:
        - name: source
          workspace: pipeline-workspace
