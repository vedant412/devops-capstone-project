apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: cleanup
      image: docker.io/library/alpine:3.23
      env:
        - name: SOURCE_DIR
          value: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        find "$SOURCE_DIR" -mindepth 1 -maxdepth 1 ! -name lost+found -exec rm -rf -- {} +
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: check-accounts
spec:
  workspaces:
    - name: source
  steps:
    - name: lint-with-flake8
      image: docker.io/library/python:3.12-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        python -m venv .venv
        .venv/bin/pip install -r requirements-dev.txt
        .venv/bin/flake8 service tests
    - name: run-nosetests
      image: docker.io/library/python:3.12-slim
      workingDir: $(workspaces.source.path)
      env:
        - name: DATABASE_URI
          value: 'sqlite:///:memory:'
      script: |
        #!/bin/sh
        set -eu
        .venv/bin/nosetests tests.test_routes tests.test_models tests.test_cli_commands
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-accounts
spec:
  params:
    - name: image
      type: string
  workspaces:
    - name: source
      readOnly: true
  steps:
    - name: deploy
      image: quay.io/openshift/origin-cli:4.19
      workingDir: $(workspaces.source.path)
      env:
        - name: ACCOUNTS_IMAGE
          value: $(params.image)
        - name: HOME
          value: /tmp
      script: |
        #!/bin/sh
        set -eu
        oc set image --local -f deploy/deployment.yaml "accounts=$ACCOUNTS_IMAGE" -o yaml > /tmp/accounts.yaml
        oc apply -f /tmp/accounts.yaml -f deploy/service.yaml
        oc rollout status deployment/accounts --timeout=180s
