name: Accounts CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URI: 'sqlite:///:memory:'
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint with Flake8
        run: flake8 service tests
      - name: Run unit tests with nosetests
        run: nosetests tests.test_routes tests.test_models tests.test_cli_commands
      - name: Build and list the accounts Docker image
        run: |
          docker build --tag accounts:1.0 .
          docker image ls --format 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.CreatedAt}}\t{{.Size}}' accounts:1.0
      - name: Verify container on port 8080
        run: |
          docker run --detach --name accounts-ci --publish 127.0.0.1:8080:8080 --env DATABASE_URI='sqlite:////tmp/accounts.db' accounts:1.0
          trap 'docker logs accounts-ci; docker rm -f accounts-ci' EXIT
          curl --fail --silent --show-error --max-time 5 --retry 12 --retry-connrefused --retry-all-errors --retry-delay 1 http://127.0.0.1:8080/health
